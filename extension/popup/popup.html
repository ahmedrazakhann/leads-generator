<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maps Lead Scraper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- ── Header ── -->
  <header class="header">
    <div class="header-left">
      <div class="logo">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z" fill="url(#logoGrad)"/>
          <defs>
            <linearGradient id="logoGrad" x1="5" y1="2" x2="19" y2="22" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#4ade80"/>
              <stop offset="100%" stop-color="#22d3ee"/>
            </linearGradient>
          </defs>
        </svg>
        <span class="logo-text">Lead<span class="accent">Scraper</span></span>
      </div>
    </div>
    <div class="header-right">
      <div class="lead-badge" id="leadBadge">
        <span id="leadCount">0</span> leads
      </div>
    </div>
  </header>

  <!-- ── Status Bar ── -->
  <div class="status-bar" id="statusBar">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Open Google Maps and search for businesses</span>
  </div>

  <!-- ── Progress ── -->
  <div class="progress-wrap" id="progressWrap" style="display:none">
    <div class="progress-track">
      <div class="progress-fill" id="progressFill"></div>
    </div>
    <span class="progress-label" id="progressLabel">0 / 200</span>
  </div>

  <!-- ── Controls ── -->
  <section class="controls-section">
    <div class="control-row">
      <div class="field-group">
        <label class="field-label" for="maxResults">Max Results</label>
        <input type="number" id="maxResults" class="input-field" value="100" min="1" max="500" />
      </div>
      <div class="field-group">
        <label class="field-label" for="exportFormat">Export As</label>
        <select id="exportFormat" class="input-field select-field">
          <option value="csv">CSV</option>
          <option value="xlsx">Excel (XLSX)</option>
        </select>
      </div>
    </div>

    <!-- Field selector -->
    <div class="field-label" style="margin-bottom: 8px; margin-top: 4px;">Select Fields</div>
    <div class="fields-grid" id="fieldsGrid">
      <label class="checkbox-label"><input type="checkbox" id="f-name" checked /> Name</label>
      <label class="checkbox-label"><input type="checkbox" id="f-category" checked /> Category</label>
      <label class="checkbox-label"><input type="checkbox" id="f-address" checked /> Address</label>
      <label class="checkbox-label"><input type="checkbox" id="f-phone" checked /> Phone</label>
      <label class="checkbox-label"><input type="checkbox" id="f-website" checked /> Website</label>
      <label class="checkbox-label"><input type="checkbox" id="f-rating" checked /> Rating</label>
      <label class="checkbox-label"><input type="checkbox" id="f-reviews" checked /> Reviews</label>
      <label class="checkbox-label"><input type="checkbox" id="f-hours" /> Hours</label>
      <label class="checkbox-label"><input type="checkbox" id="f-plusCode" /> Plus Code</label>
      <label class="checkbox-label"><input type="checkbox" id="f-mapsUrl" /> Maps URL</label>
    </div>
  </section>

  <!-- ── Action Buttons ── -->
  <div class="btn-row">
    <button class="btn btn-primary" id="btnStart">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      Start Scraping
    </button>
    <button class="btn btn-secondary" id="btnPause" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      Pause
    </button>
    <button class="btn btn-danger" id="btnStop" disabled>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6z"/></svg>
      Stop
    </button>
  </div>

  <!-- ── Results Table ── -->
  <section class="results-section" id="resultsSection" style="display:none">
    <div class="results-header">
      <span class="results-title">Scraped Leads</span>
      <div class="results-actions">
        <button class="btn-icon" id="btnClear" title="Clear all leads">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
        </button>
        <button class="btn btn-export" id="btnExport">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
          Export
        </button>
      </div>
    </div>

    <div class="table-wrap">
      <table class="leads-table" id="leadsTable">
        <thead id="leadsHead"></thead>
        <tbody id="leadsBody"></tbody>
      </table>
    </div>
  </section>

  <!-- ── Toast ── -->
  <div class="toast" id="toast"></div>

  <script src="../lib/xlsx.full.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
