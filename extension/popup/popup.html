<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MapLeads Pro — Extension</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- ── Header ── -->
  <header class="header">
    <div class="header-left">
      <div class="logo">
        <img src="../icons/logo_horizontal.png" alt="SaaSquatch Pro" class="logo-horizontal-img" />
      </div>
    </div>
    <div class="header-right">
      <div class="lead-badge" id="leadBadge">
        <span id="leadCount">0</span> leads
      </div>
    </div>
  </header>

  <main class="main-content">
    <!-- ── Initial State ── -->
    <div class="hero-section" id="heroSection">
      <div class="hero-content">
        <div class="hero-icon-pulse">
          <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        </div>
        <h1>Ready to Scale?</h1>
        <p>Search for businesses on Google Maps and click Start to collect high-quality leads instantly.</p>
      </div>
    </div>

    <!-- ── Status & Computation ── -->
    <div class="active-scoping" id="activeScoping" style="display:none">
      <div class="status-bar" id="statusBar">
        <div class="status-dot" id="statusDot"></div>
        <span id="statusText">Ready to scrape</span>
      </div>

  

      <div class="progress-wrap" id="progressWrap" style="display:none">
        <div class="progress-header">
          <span class="progress-label">SCRAPING PROGRESS</span>
          <span class="progress-label" id="progressLabel">0 / 100</span>
        </div>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
      </div>
    </div>

    <!-- ── Controls ── -->
    <section class="controls-section">
      <div class="control-row">
        <div class="field-group">
          <label class="field-label" for="maxResults">Target Leads</label>
          <div class="input-wrapper">
            <input type="number" id="maxResults" class="input-field" value="100" min="1" max="1000" />
            <span class="input-suffix">leads</span>
          </div>
        </div>
        <div class="field-group">
          <label class="field-label" for="exportFormat">Export As</label>
          <select id="exportFormat" class="input-field select-field">
            <option value="csv">CSV (Standard)</option>
            <option value="xlsx" selected>Excel (.xlsx)</option>
          </select>
        </div>
      </div>

      <!-- Field selector -->
      <div class="field-label" style="margin-bottom: 12px;">Extraction Fields</div>
      <div class="chips-grid" id="fieldsGrid">
        <label class="chip">
          <input type="checkbox" id="f-name" checked />
          <span>Name</span>
        </label>
        <label class="chip">
          <input type="checkbox" id="f-category" checked />
          <span>Category</span>
        </label>
        <label class="chip">
          <input type="checkbox" id="f-address" checked />
          <span>Address</span>
        </label>
        <label class="chip">
          <input type="checkbox" id="f-phone" checked />
          <span>Phone</span>
        </label>
        <label class="chip">
          <input type="checkbox" id="f-website" checked />
          <span>Website</span>
        </label>
        <label class="chip">
          <input type="checkbox" id="f-rating" checked />
          <span>Rating</span>
        </label>
        <label class="chip">
          <input type="checkbox" id="f-reviews" checked />
          <span>Reviews</span>
        </label>
        <label class="chip">
          <input type="checkbox" id="f-hours" />
          <span>Hours</span>
        </label>
      </div>
    </section>

    <!-- ── Action Buttons ── -->
    <div class="btn-group">
      <button class="btn btn-primary" id="btnStart">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        Launch Scraper
      </button>
      <div class="btn-subgroup">
        <button class="btn btn-secondary" id="btnPause" disabled title="Pause / Resume">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
        </button>
        <button class="btn btn-danger" id="btnStop" disabled title="Stop">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h12v12H6z"/></svg>
        </button>
      </div>
    </div>

    <!-- ── Results Table ── -->
    <section class="results-section" id="resultsSection" style="display:none">
      <div class="results-header">
        <div class="results-title-group">
          <span class="results-title">Live Leads</span>
          <span class="live-indicator">LIVE</span>
        </div>
        <div class="results-actions">
          <button class="btn-icon" id="btnClear" title="Clear all">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
          <button class="btn-export" id="btnExport">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            Export
          </button>
        </div>
      </div>

      <div class="table-wrap">
        <table class="leads-table" id="leadsTable">
          <thead id="leadsHead"></thead>
          <tbody id="leadsBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- ── Toast ── -->
  <div class="toast" id="toast"></div>

  <script src="../lib/exceljs.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
